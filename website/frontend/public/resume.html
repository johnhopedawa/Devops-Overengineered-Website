<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>John Hope Dawa - Resume</title>
    <link rel="stylesheet" href="styles.css?v=11.99">
    <link rel="icon" type="image/svg+xml" href="assets/images/jd-logo.svg" />
</head>
<body>
    <div class="resume-page-header">
        <a href="index.html" class="back-link">&larr; Back to Home</a>
    </div>
    <div id="resume" class="resume-container">
        <p>Loading...</p>
    </div>

    <script>
        fetch('/api/resume')
            .then(response => response.json())
            .then(data => {
                displayResume(data);
            })
            .catch(error => {
                console.error('Error fetching resume:', error);
                document.getElementById('resume').innerHTML = '<p>Error loading resume data</p>';
            });

        function escapeHtml(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function renderDownload(download) {
            if (!download || !download.pdfUrl || !download.filename) {
                return '';
            }

            return `
                <div class="resume-actions" aria-label="Resume downloads">
                    <a
                        href="${escapeHtml(download.pdfUrl)}"
                        class="btn btn-primary resume-download-link"
                        download="${escapeHtml(download.filename)}"
                    >Download PDF</a>
                </div>
            `;
        }

        function displayResume(data) {
            const resumeDiv = document.getElementById('resume');

            let html = `
                <div class="resume-heading">
                    <div>
                        <h1>${escapeHtml(data.name)}</h1>
                        <p><strong>${escapeHtml(data.title)}</strong> | ${escapeHtml(data.location)}</p>
                    </div>
                    ${renderDownload(data.download)}
                </div>
                <p>${escapeHtml(data.summary)}</p>

                <h2>Skills</h2>
                <p>${(data.skills || []).map(escapeHtml).join(', ')}</p>

                ${renderProjects(data.projects)}

                <h2>Experience</h2>
            `;

            (data.experience || []).forEach(job => {
                html += `
                    <div class="job">
                        <h3>${escapeHtml(job.role)} - ${escapeHtml(job.company)}</h3>
                        <p class="duration">${escapeHtml(job.duration)} | ${escapeHtml(job.location)}</p>
                        <ul>
                            ${(job.responsibilities || []).map(resp => `<li>${escapeHtml(resp)}</li>`).join('')}
                        </ul>
                    </div>
                `;
            });

            html += `
                <h2>Interests</h2>
                <p>${(data.interests || []).map(escapeHtml).join(', ')}</p>
            `;

            resumeDiv.innerHTML = html;
        }

        function renderProjects(projects) {
            if (!Array.isArray(projects) || projects.length === 0) {
                return '';
            }

            let html = '<h2>Projects</h2>';
            projects.forEach(project => {
                html += `
                    <div class="job">
                        <h3>${escapeHtml(project.name)}</h3>
                        <p class="duration">${escapeHtml(project.stack)}</p>
                        <ul>
                            ${(project.details || []).map(detail => `<li>${escapeHtml(detail)}</li>`).join('')}
                        </ul>
                    </div>
                `;
            });

            return html;
        }
    </script>
</body>
</html>
